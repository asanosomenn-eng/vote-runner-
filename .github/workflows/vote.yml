name: Cloud Parallel Vote
on:
  workflow_dispatch:

jobs:
  run-vote:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1,2,3,4,5]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aiohttp
      - run: python vote.py
